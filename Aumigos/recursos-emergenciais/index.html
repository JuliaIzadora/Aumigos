      <main class="container-principal">
    <div class="quadro-branco">
      <div class="cabecalho-quadro">
        <span class="icone-titulo">$</span>
        <h2>Recursos Emergenciais</h2>
      </div>

      <form id="form-emergencia" class="grid-formulario">
        <div class="coluna-esquerda">
          <label class="titulo-campo">Novo Registro</label>
          <div class="radio-grupo">
            <label><input type="radio" name="tipo" value="Solicitação" checked> Solicitação</label>
            <label><input type="radio" name="tipo" value="Utilização"> Utilização</label>
          </div>

          <label class="titulo-campo" for="motivo">Motivo:</label>
          <textarea id="motivo" name="motivo" rows="3" required></textarea>

          <label class="titulo-campo" for="responsavel">Responsável:</label>
          <input type="text" id="responsavel" name="responsavel" required>
        </div>

        <div class="coluna-direita">
          <label class="titulo-campo" for="valor">Valor:</label>
          <input type="text" id="valor" name="valor" placeholder="R$ 0,00" required>

          <label class="titulo-campo" for="data">Data:</label>
          <input type="date" id="data" name="data" required>

          <label class="titulo-campo">Status da autorização:</label>
          <div class="badge-status aguardando">Aguardando</div>

          <div class="botoes-acao">
            <button type="reset" class="btn-cancelar">Cancelar</button>
            <button type="submit" class="btn-finalizar">Finalizar</button>
          </div>
        </div>
      </form>

      <div class="caixa-tabela">
        <h3>Histórico de registros recentes</h3>
        <table class="tabela-registros">
          <thead>
            <tr>
              <th>Responsável</th>
              <th>Data</th>
              <th>Valor</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-historico-sec">
            
          </tbody>
        </table>
      </div>
    </div>
  </main>
<script src="script.js"></script>

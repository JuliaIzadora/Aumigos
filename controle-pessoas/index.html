<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aumigos</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div>
        <nav id="sidebar">
            <div id="logo">
                <a href="../page-login/index.html" onclick="sairDoSistema(event)" title="sair e voltar para o login">
                    <img src="../cadrastados/logo-aumigos.png" id="logo-aumigos" alt="Avatar">
                </a>
            </div>
            <ul id="side_items">
                <li>
                    <a href="../cadrastados/index.html" >
                        <i><ion-icon name="home"></ion-icon></i>
                    </a>
                </li>
                <li>
                    <a href="../page-cadastro/index.html" class="link-icone">
                        <i><ion-icon name="paw"></ion-icon></i>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="abrirTelaFinanceira(event)" class="link-icone">
                        <ion-icon name="logo-usd"></ion-icon>
                    </a>
                </li>
                <li>
                    <a href="../controle-estoque/index.html">
                        <ion-icon name="logo-dropbox"></ion-icon>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <ion-icon name="person-outline"></ion-icon>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

        <main class="container-principal">
    <div class="quadro-branco">
      <div class="cabecalho-quadro">
        <ion-icon name="person-outline" class="icone-verde-outline"></ion-icon>
        <h2>Controle de Pessoas •</h2>
        <select id="filtro-tipo-pessoa" class="select-titulo">
          <option value="VOLUNTARIOS">VOLUNTÁRIOS</option>
          <option value="FORNECEDORES">Fornecedores</option>
          <option value="DOADORES">Doadores</option>
          <option value="ADOTANTES">Adotantes</option>
        </select>
      </div>

      <div class="barra-ferramentas">
        <div class="grupo-busca">
          <select id="ordem-pessoas" class="select-ordem" title="Ordenar">
            <option value="padrao">☰ Ordenar</option>
            <option value="crescente">Ordem Crescente (A-Z)</option>
            <option value="decrescente">Ordem Decrescente (Z-A)</option>
          </select>
          <input type="text" id="pesquisa-pessoa" placeholder="Pesquisar pessoa...">
        </div>
        <button type="button" id="btn-nova-pessoa" class="btn-novo">Novo</button>
      </div>

      <div class="tabela-wrapper">
        <table class="tabela-sistema">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th id="coluna-documento">CPF</th>
              <th>Endereço</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela-pessoas">

          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="modal-pessoa" class="modal-overlay" style="display: none;">
    <div class="quadro-branco modal-box">
      <div class="cabecalho-quadro space-between">
        <div style="display: flex; align-items: center; gap: 10px;">
          <ion-icon name="person-outline" class="icone-verde-outline"></ion-icon>
          <h2 id="titulo-modal-pessoa">Incluir Novo Cadastro</h2>
        </div>
        <button type="button" id="btn-fechar-pessoa" class="btn-x">X</button>
      </div>

      <form id="form-pessoa" class="grid-form">
        <div class="col-form">
          <label>Nome: <input type="text" name="nome" required></label>
          <label>Telefone: <input type="text" name="telefone" maxlength="15" placeholder="(00) 00000-0000" required></label>
          <label>CPF: <input type="text" name="cpf" maxlength="14" placeholder="000.000.000-00"></label>
          <label>CNPJ: <input type="text" name="cnpj" maxlength="18" placeholder="00.000.000/0000-00"></label>
          <label>Endereço: <input type="text" name="endereco"></label>
        </div>

        <div class="col-form">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
            <label style="font-weight: bold;">Atestado de<br>Antecedentes Criminais</label>
            <label class="btn-upload-doc" title="Anexar documento">
              <ion-icon name="document-text"></ion-icon>
              <input type="file" name="atestado" style="display: none;" onchange="document.getElementById('status-anexo').textContent = this.files[0]?.name || ''">
            </label>
          </div>
          <small id="status-anexo" style="color: #666;"></small>

          <label style="margin-top: 15px;">Tipo do cadastro:
            <select name="tipoCadastro" id="modal-tipo-pessoa" required>
              <option value="VOLUNTARIOS">Voluntários</option>
              <option value="FORNECEDORES">Fornecedores</option>
              <option value="DOADORES">Doadores</option>
              <option value="ADOTANTES">Adotantes</option>
            </select>
          </label>
        </div>

        <div class="rodape-botoes">
          <button type="button" id="btn-excluir-pessoa" class="btn-cinza" style="display: none;">excluir</button>
          <div style="display: flex; gap: 15px; margin-left: auto;">
            <button type="reset" class="btn-cinza">Limpar</button>
            <button type="submit" class="btn-verde">Finalizar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

    <script src="../auth.js"></script>
    <script src="script.js"></script>
    <script  type = "module"  src = " https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js " > </script> <script 
    nomodule src = " https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js " > </script>  
</body>
</html>

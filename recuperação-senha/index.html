<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aumigos</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Recuperar Senha</h2>
        <p id="instrucao">Informe o seu CPF cadastrado para redefinir sua senha.</p>
        
        <!-- ETAPA 1: Validar CPF -->
        <form id="form-cpf">
            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
            </div>
            
            <button type="submit">Verificar CPF</button>
        </form>

        <!-- ETAPA 2: Criar Nova Senha (começa escondida) -->
        <form id="form-nova-senha" class="escondido">
            <div class="form-group">
                <label for="nova-senha">Nova Senha</label>
                <input type="password" id="nova-senha" placeholder="Mínimo 4 caracteres" required>
            </div>

            <div class="form-group">
                <label for="confirmar-senha">Confirmar Nova Senha</label>
                <input type="password" id="confirmar-senha" placeholder="Repita a nova senha" required>
            </div>

            <button type="submit">Salvar Nova Senha</button>
        </form>

        <div id="mensagem" class="mensagem"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
